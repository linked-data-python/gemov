[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemov"
version = "0.1.0"
description = "Generating Modular Ontologies and Vocabularies: patterns over dimensions, on rdflib"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Maxime Lefrançois", email = "maxime.lefrancois@emse.fr" }]
dependencies = ["rdflib>=6.0", "PyYAML>=6.0"]

[project.optional-dependencies]
# patterns may be written in Turtle's own notation, inside Python
ldpy = ["linked-data-python>=0.6"]
# the documentation generator asks the graph its questions in ldpy
docs = ["linked-data-python>=0.6"]
# the HTTP server: one namespace, modular and versioned, plus views on demand
server = ["flask>=3.0", "linked-data-python>=0.6"]
site = ["mkdocs", "mkdocs-material"]
dev = ["pytest", "flask>=3.0", "linked-data-python>=0.6"]

[project.scripts]
gemov = "gemov.cli:main"

[tool.setuptools.packages.find]
include = ["gemov*"]

# The documentation queries are written in Linked-Data Python and loaded by
# `gemov/doc/queries.py` through ldpy's import hook: they are data as far as
# packaging is concerned, and a wheel without them boots and then fails on the
# first page it renders.
[tool.setuptools.package-data]
gemov = ["**/*.ldpy"]
